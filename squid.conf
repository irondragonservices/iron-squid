# A forward proxy for a private network, with nothing exposed to the internet.
#
# Upstream's Dockerfile referenced docker/squid.conf, which was never committed
# — the image could not build at all. This is a deliberately small replacement:
# it proxies for RFC1918 clients, refuses everything else, caches in memory
# only, and logs where a container log collector can see it.

# Bind above 1024: the container does not run as root and cannot take a
# privileged port.
http_port 3128

# Who is allowed to use this proxy. Narrow it to your own network — as written
# it accepts any private address, which is wider than most deployments want.
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 21          # ftp
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

# Order matters: every deny below has to precede the allow.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localnet
http_access allow localhost
http_access deny all

# Memory only. A disk cache needs `squid -z` before first start and a writable
# spool directory, which is a lot of moving parts for a proxy that is usually
# in front of a network rather than a website.
cache deny all
cache_mem 64 MB
maximum_object_size_in_memory 512 KB

# Everything a container log collector can read.
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr

# Squid needs somewhere to write its pid and any swap state.
pid_filename /tmp/squid.pid
coredump_dir /tmp

# Do not advertise the version.
httpd_suppress_version_string on
via off
forwarded_for delete

refresh_pattern ^ftp:       1440  20%  10080
refresh_pattern ^gopher:    1440   0%   1440
refresh_pattern -i (/cgi-bin/|\?) 0 0%     0
refresh_pattern .              0  20%   4320
